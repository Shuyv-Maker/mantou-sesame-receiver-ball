<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>馒头芝麻收图球</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main
      id="receiver-ball"
      class="receiver-ball is-unpaired"
      aria-label="馒头芝麻收图球：拖入图片即可保存到已连接的项目，右键打开菜单，双击查看连接帮助"
      role="button"
      tabindex="0"
    >
      <canvas id="receiver-orb" width="128" height="128" aria-hidden="true"></canvas>
      <span class="receiver-badge" aria-hidden="true"></span>
      <span id="receiver-state" class="sr-only">待连接</span>
      <span id="receiver-copy" class="sr-only">网站自动连接</span>
      <span id="receiver-live" class="sr-only" aria-live="polite"></span>
    </main>
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
